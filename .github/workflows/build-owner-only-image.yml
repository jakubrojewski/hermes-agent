name: Build owner-only Hermes deployment image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact deployment source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable AMD64 image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jakubrojewski/hermes-agent:owner-only-f5894c4
          labels: |
            org.opencontainers.image.revision=f5894c4dc40887118f988a44883935ac6b69470c
            org.opencontainers.image.source=https://github.com/jakubrojewski/hermes-agent
          build-args: |
            HERMES_GIT_SHA=f5894c4dc40887118f988a44883935ac6b69470c
          cache-from: type=gha,scope=owner-only-amd64
          cache-to: type=gha,mode=max,scope=owner-only-amd64
          provenance: true
          sbom: true
